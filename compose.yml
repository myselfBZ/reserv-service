services:
  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
      - cache
    networks:
      - backend
  db:
    image: postgres:17.6
    container_name: postgres-db
    environment:
      POSTGRES_DB: reserv_service
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    networks:
      - backend 
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  cache:
    image: redis:8.2.3
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  
volumes:
  db-data:

networks:
  backend:
    driver: bridge
